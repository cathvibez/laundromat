<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laundromat — Rulebook</title>
<style>
/* =========================================================================
   LAUNDROMAT — RULEBOOK
   A5 booklet, 148 x 210 mm, colour, single-sided page order.

   Design system lifted from web/src/ui/styles.css and web/public/mockup.html:
   cream paper, warm ink, 2px ink outlines, hard offset shadows with no blur,
   fractions of a degree of rotation, the six player colours from the art,
   and the WASHED / BACK / DAMP rubber stamps.

   TYPE NOTE: the app uses Fredoka, served from Google Fonts. This booklet has
   to be self-contained, so Fredoka is requested first and the stack falls back
   to the system rounded face (SF Pro Rounded on macOS / iOS, Segoe UI on
   Windows). If Fredoka is licensed for print, embed the woff2 here as a
   base64 @font-face and nothing else changes.
   ========================================================================= */

:root{
  /* paper */
  --paper:#F7F1E4;
  --paper-2:#FDF9F1;
  --card:#FFFFFF;
  --ink:#3B3330;
  --dim:#8B7F73;
  --line:#E3D8C4;
  --rule-2:#D3C4AA;

  /* meaning */
  --good:#5FA86B;
  --bad:#E0705A;
  --damp:#E2A93F;

  /* the six colours, lifted from the printed art */
  --p0:#6E52A3;  /* purple */
  --p1:#B0762E;  /* tan */
  --p2:#3F6F90;  /* blue */
  --p3:#F0642B;  /* orange */
  --p4:#3F9C48;  /* green */
  --p5:#E63A8B;  /* pink */

  /* cut paper */
  --shadow:5px 5px 0 rgba(59,51,48,.15);
  --shadow-sm:3px 3px 0 rgba(59,51,48,.14);
  --shadow-xs:2px 2px 0 rgba(59,51,48,.13);

  /* the three art sheets, inlined by build.py */
  --sheet1:url('__ART:sheet1.jpg__');
  --sheet2:url('__ART:sheet2.jpg__');
  --sheet3:url('__ART:sheet3.jpg__');
  --items:url('__ART:items.png__');
}

*{box-sizing:border-box}

html{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }

body{
  margin:0;
  font-family:'Fredoka', ui-rounded, 'SF Pro Rounded', 'SF Compact Rounded', 'Segoe UI', system-ui, sans-serif;
  color:var(--ink);
  font-size:10px;
  line-height:1.45;
  background:#DFD5C2;
}

/* ---------------------------------------------------------------- pages */

@page{ size:148mm 210mm; margin:0; }

.page{
  position:relative;
  width:148mm;
  height:210mm;
  padding:12mm 11mm 11mm;
  background:var(--paper);
  background-image:
    radial-gradient(rgba(139,127,115,.055) 1px, transparent 1px),
    radial-gradient(rgba(139,127,115,.035) 1px, transparent 1px);
  background-size:22px 22px, 13px 13px;
  background-position:0 0, 7px 9px;
  overflow:hidden;
  page-break-after:always;
  break-after:page;
}
.page:last-child{ page-break-after:auto; break-after:auto; }

@media screen{
  body{ padding:26px 0 60px; }
  .page{ margin:0 auto 22px; box-shadow:0 10px 0 rgba(0,0,0,.10), 0 0 0 1px rgba(0,0,0,.10); }
}
@media print{
  body{ background:none; padding:0; }
  .page{ margin:0; box-shadow:none; }
}

/* folio */
.folio{
  position:absolute; left:11mm; right:11mm; bottom:5mm;
  display:flex; align-items:baseline; gap:6px;
  font-size:7.5px; color:var(--dim); letter-spacing:.06em;
}
.folio .sp{flex:1}
.folio b{font-weight:600; text-transform:uppercase; letter-spacing:.12em}

/* ------------------------------------------------------------ typography */

h1,h2,h3,h4{margin:0; font-weight:700; line-height:1.1}

.ptitle{
  display:inline-block;
  background:var(--card); border:2px solid var(--ink); border-radius:12px;
  padding:5px 13px 6px; box-shadow:var(--shadow);
  transform:rotate(-1.1deg);
  font-size:19px; font-weight:700;
  margin-bottom:9px;
}
.ptitle.sm{ font-size:15px; padding:4px 11px 5px; }

.kicker{
  font-size:8px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--dim); font-weight:600; margin-bottom:4px;
}
.lede{ font-size:11.5px; line-height:1.42; margin:0 0 9px; }
p{margin:0 0 7px}
b,strong{font-weight:600}
em{font-style:italic}
.dimtext{color:var(--dim)}
.small{font-size:8.5px; line-height:1.4}

/* the one-line rule, stamped */
.creed{
  background:#FFE9A8; border:2px solid var(--ink); border-radius:12px;
  box-shadow:var(--shadow); padding:8px 14px 9px; text-align:center;
  transform:rotate(-.7deg); margin:10px 0;
}
.creed b{ display:block; font-size:16px; font-weight:700; letter-spacing:.005em; }
.creed span{ display:block; font-size:8.5px; color:#8a6b22; margin-top:2px; }

/* callout */
.callout{
  background:var(--paper-2); border:2px solid var(--rule-2); border-left-width:5px;
  border-radius:10px; padding:6px 9px 7px; box-shadow:var(--shadow-xs);
  font-size:9px; margin:8px 0;
}
.callout b{font-weight:600}

/* provisional marker — the ONE treatment for anything unresolved */
.prov{
  display:inline-block; vertical-align:2px;
  font-size:6.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  color:#8a6b22; background:#FBF2DC; border:1.5px dashed var(--damp);
  border-radius:999px; padding:1px 6px 1.5px; margin-left:4px; white-space:nowrap;
}
.provbox{
  background:#FBF2DC; border:2px dashed var(--damp); border-radius:10px;
  padding:6px 9px 7px; margin:8px 0; font-size:8.5px; line-height:1.4;
  box-shadow:var(--shadow-xs);
}
.provbox > .hd{
  font-weight:700; font-size:7.5px; letter-spacing:.12em; text-transform:uppercase;
  color:#8a6b22; margin-bottom:3px;
}
.provbox ul{margin:3px 0 0; padding-left:14px}
.provbox li{margin-bottom:2px}
.provbox .dflt{ font-weight:600; }

/* ============================== THE CARD ==============================
   Mirrors web/src/ui/Card.tsx + styles.css: ink outline, offset shadow,
   shade dot top-left, name strip along the bottom, verdict stamp across
   the face, and a small fixed tilt per card.
   Sprites follow web/src/ui/art.ts exactly:
     garment sheets are 5 cols x 4 rows; specials/events 5 cols x 2 rows.
   ===================================================================== */

.gcard{
  position:relative; flex:none;
  background:var(--card); border:2px solid var(--ink); border-radius:9px;
  box-shadow:var(--shadow-xs); overflow:hidden;
}
.gcard.s-xs{ --cw:40; width:40px;  height:64px;  border-radius:6px; }
.gcard.s-sm{ --cw:56; width:56px;  height:90px;  }
.gcard.s-md{ --cw:72; width:72px;  height:116px; }
.gcard.s-lg{ --cw:92; width:92px;  height:148px; border-radius:11px; box-shadow:var(--shadow-sm); }
.gcard.s-xl{ --cw:112; width:112px; height:180px; border-radius:12px; box-shadow:var(--shadow); }

.gcard .pic{
  position:absolute; inset:0;
  background-repeat:no-repeat;
  background-image:var(--sheet);
  background-size:500% 400%;
  background-position:calc(var(--c) * 25%) calc(var(--r) * 33.3333%);
}
/* Specials + events live on items.png, which is a print sheet WITH A MARGIN,
   so its cells are addressed in source pixels rather than as an even grid —
   the even-grid crop leaves a black band down the right of each card.
   This is the crop the approved style study used. */
.gcard.special .pic, .gcard.event .pic{
  background-image:var(--items);
  --s:calc(var(--cw) / 194.6);
  background-size:calc(1069px * var(--s)) calc(731px * var(--s));
  background-position:
    calc(-1 * (37px + var(--c) * 194.6px) * var(--s))
    calc(-1 * (43px + var(--r) * 316px) * var(--s));
}

/* missing art — the app's hatched "art pending" plate, not a hole */
.gcard .pic.pending{
  background-image:repeating-linear-gradient(45deg,#FBF7EE,#FBF7EE 6px,#F4ECDD 6px,#F4ECDD 12px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; text-align:center; padding:5px;
}
.gcard .pic.pending span{ font-weight:600; font-size:8.5px; line-height:1.15; }
.gcard .pic.pending small{ font-size:6.5px; color:var(--dim); }
.gcard.s-xs .pic.pending span{ font-size:5px; line-height:1.05; letter-spacing:-.01em }
.gcard.s-xs .pic.pending small{ display:none }
.gcard.s-xl .pic.pending span{ font-size:11px }

.gcard .dot{
  position:absolute; top:5px; left:5px; width:9px; height:9px; border-radius:50%;
}
.gcard.s-xs .dot{ width:7px; height:7px; top:3px; left:3px; }
.gcard.s-lg .dot{ width:12px; height:12px; top:7px; left:7px; }
.gcard.s-xl .dot{ width:14px; height:14px; top:8px; left:8px; }
.gcard .dot.d{ background:var(--dotc); }
.gcard .dot.l{ background:transparent; border:2.5px solid var(--dotc); }
.gcard.s-xs .dot.l{ border-width:2px }

.gcard .nm{
  position:absolute; left:0; right:0; bottom:0;
  padding:2px 3px 2.5px; font-size:6px; font-weight:600;
  letter-spacing:.04em; text-transform:uppercase; text-align:center;
  color:var(--dim); background:rgba(255,255,255,.93);
  border-top:1px solid var(--line);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.gcard.s-lg .nm{ font-size:7.5px; padding:3px 4px 3.5px; }
.gcard.s-xl .nm{ font-size:9px; padding:4px 5px 4.5px; }
.gcard.s-xs .nm{ font-size:5px; padding:1.5px 2px; }
.gcard.special .nm, .gcard.event .nm{ text-transform:none; letter-spacing:0; }

/* verdict stamps — the exact words players see in the app */
.stamp{
  position:absolute; top:50%; left:50%;
  font-size:7px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  padding:2px 5px; border:2px solid; border-radius:5px;
  background:rgba(255,255,255,.9); white-space:nowrap;
}
.stamp.wash{ color:var(--good); border-color:var(--good); transform:translate(-50%,-50%) rotate(-11deg); }
.stamp.back{ color:var(--bad);  border-color:var(--bad);  transform:translate(-50%,-50%) rotate(-8deg); }
.stamp.damp{ color:#9A6B10;     border-color:var(--damp); transform:translate(-50%,-50%) rotate(-9deg); }
.gcard.s-lg .stamp, .gcard.s-xl .stamp{ font-size:9px; padding:3px 7px; border-width:2.5px; }

/* deterministic-looking tilts, as Card.tsx does from the card id */
.t1{transform:rotate(-1.65deg)} .t2{transform:rotate(1.1deg)}
.t3{transform:rotate(-.55deg)}  .t4{transform:rotate(1.65deg)}
.t5{transform:rotate(-1.1deg)}  .t6{transform:rotate(.55deg)}

/* ------------------------------------------------------------- washers */

.washer{
  background:var(--paper-2); border:2px solid var(--ink); border-radius:12px;
  box-shadow:var(--shadow-sm); padding:6px 7px 7px; position:relative;
}
.washer.off{ background:#F0EADD; border-color:var(--rule-2); }
.washer.dead{ background:#EFE9DF; border-color:var(--rule-2); opacity:.62; }
.washer .whead{ display:flex; align-items:center; gap:5px; margin-bottom:5px; }
.washer .wname{ font-weight:600; font-size:9.5px; }
.washer .cap{ margin-left:auto; font-size:7.5px; color:var(--dim); }
.drum{
  background:#FFFDF8; border:2px dashed var(--rule-2); border-radius:9px;
  padding:6px 6px 5px; display:flex; align-items:flex-start; gap:3px;
  min-height:66px;
}
.drum.tight{ gap:0 }
.drum.tight .gcard{ margin-right:-9px }
.drum.tight .gcard:last-child{ margin-right:0 }
.drum.empty{ align-items:center; justify-content:center; color:var(--dim); font-size:8px; }
.verdictline{ margin-top:5px; font-size:8px; }
.verdictline b{font-weight:600}

.power{
  font-size:6.5px; font-weight:700; padding:1px 6px 1.5px; border-radius:999px; border:1.5px solid;
  letter-spacing:.06em;
}
.power.on{ color:#3D7A48; border-color:var(--good); background:#EAF5EC; }
.power.off{ color:var(--dim); border-color:var(--rule-2); background:#F4EFE5; }
.power.rac{ color:#9A6B10; border-color:var(--damp); background:#FBF2DC; }
.power.gone{ color:#B24E3B; border-color:var(--bad); background:#FBECE8; }

/* ------------------------------------------------------------ furniture */

.chip{
  display:inline-block; background:var(--card); border:2px solid var(--rule-2);
  border-radius:999px; padding:2px 9px 3px; font-size:8px; font-weight:600;
  box-shadow:var(--shadow-xs);
}
.chip.key{ border-color:var(--damp); color:#9A6B10; }
.chip.good{ border-color:var(--good); color:#3D7A48; }
.chip.bad{ border-color:var(--bad); color:#B24E3B; }

.panel{
  background:var(--paper-2); border:2px solid var(--ink); border-radius:12px;
  box-shadow:var(--shadow-sm); padding:8px 10px 9px;
}
.panel.soft{ border-color:var(--rule-2); box-shadow:var(--shadow-xs); }
.panel h3{ font-size:10px; margin-bottom:4px; }

.grid{display:grid; gap:7px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.row{display:flex; gap:7px; align-items:flex-start}
.row.c{align-items:center}
.wrap{flex-wrap:wrap}
.sp{flex:1}

/* numbered steps */
.steps{ counter-reset:st; display:grid; gap:7px; }
.step{ display:flex; gap:8px; align-items:flex-start; }
.num{
  flex:none; width:20px; height:20px; border-radius:50%;
  background:var(--card); border:2px solid var(--ink); box-shadow:var(--shadow-xs);
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; margin-top:1px;
}
.num.amber{ background:#FFE9A8 }
.step .body{flex:1}
.step .body h4{ font-size:10.5px; margin-bottom:1px; }
.step .body p{ margin:0; font-size:9px; }

/* the day flow */
.flow{ display:grid; grid-template-columns:1fr; gap:0; }
.flowstep{
  display:flex; gap:8px; align-items:flex-start;
  background:var(--card); border:2px solid var(--ink); border-radius:11px;
  box-shadow:var(--shadow-xs); padding:6px 9px 7px;
}
.flowstep.sub{ background:var(--paper-2); border-color:var(--rule-2); margin-left:26px; }
.flowarrow{
  height:13px; margin-left:9px; display:flex; align-items:center;
  color:var(--rule-2); font-size:13px; line-height:1;
}
.flowarrow:before{ content:"↓"; font-weight:700; color:#B9A793; }

/* the die faces */
.dieface{
  width:26px; height:26px; flex:none; border-radius:7px;
  background:var(--paper-2); border:2px solid var(--ink); box-shadow:var(--shadow-xs);
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700;
}
.dieface.big{ width:34px; height:34px; font-size:18px; border-radius:9px; }
.dierow{
  display:flex; gap:8px; align-items:center;
  background:var(--card); border:2px solid var(--ink); border-radius:11px;
  box-shadow:var(--shadow-xs); padding:5px 8px 6px;
}
.dierow .what{ font-size:9.5px; font-weight:600; }
.dierow .why{ font-size:8px; color:var(--dim); }

/* ladders */
.rungs{ display:grid; gap:3px; }
.rung{
  display:flex; align-items:center; gap:7px;
  background:var(--card); border:2px solid var(--ink); border-radius:9px;
  box-shadow:var(--shadow-xs); padding:3px 8px 4px;
}
.rung .n{
  flex:none; width:15px; height:15px; border-radius:4px; background:#FFE9A8;
  border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center;
  font-size:8px; font-weight:700;
}
.rung .lbl{ font-size:10px; font-weight:600; }
.rung .note{ margin-left:auto; font-size:7.5px; color:var(--dim); }
.rung.r1{ background:#F1E7FA } .rung.r2{ background:#F7F1FD }
.rung.r3{ background:#EDE6DC } .rung.r4{ background:#FFFDF8 }

/* checklist */
.check{ display:grid; gap:4px; counter-reset:ck; }
.checkrow{
  display:flex; gap:7px; align-items:flex-start;
  border:2px solid var(--rule-2); border-radius:9px; background:var(--paper-2);
  padding:4px 8px 5px; box-shadow:var(--shadow-xs);
}
.checkrow .ck{
  flex:none; width:15px; height:15px; border-radius:4px; background:var(--card);
  border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center;
  font-size:8px; font-weight:700; margin-top:1px;
}
.checkrow .q{ font-size:9px; font-weight:600; }
.checkrow .a{ font-size:8px; color:var(--dim); }
.checkrow.bag{ border-color:var(--good); background:#EAF5EC; }
/* the "rules that are not final" page packs nine entries plus a coda */
.check.dense{ gap:3px }
.check.dense .checkrow{ padding:3px 7px 4px }
.check.dense .q{ font-size:8.5px }
.check.dense .a{ font-size:7.5px; line-height:1.35 }
.checkrow.bag .ck{ background:#EAF5EC; border-color:var(--good) }

/* card reference entries */
.entry{
  display:flex; gap:9px; align-items:flex-start;
  border-bottom:2px dotted var(--line); padding-bottom:6px; margin-bottom:6px;
}
.entry:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0 }
.entry .txt{ flex:1; min-width:0 }
.entry h3{ font-size:12px; margin-bottom:2px; }
.face{
  background:var(--card); border:2px solid var(--ink); border-radius:8px;
  box-shadow:var(--shadow-xs); padding:4px 7px 5px; font-size:8.5px;
  margin:0 0 4px;
}
.face b{font-weight:700}
.reminder{ font-size:7.5px; color:var(--dim); font-style:italic; margin:0 0 4px; }
.entry .txt p.body{ font-size:8.5px; margin:0 0 3px; }

/* quick-reference back page */
.qr{ display:grid; gap:6px; }
.qrbox{
  background:var(--card); border:2px solid var(--ink); border-radius:10px;
  box-shadow:var(--shadow-xs); padding:5px 8px 6px;
}
.qrbox h3{ font-size:8px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); margin-bottom:3px; }
.qrbox ol, .qrbox ul{ margin:0; padding-left:14px; font-size:8.5px; }
.qrbox li{ margin-bottom:1px }
.qrline{ font-size:8.5px }
.scissors{
  border-top:2px dashed var(--rule-2); margin:6px 0 4px; position:relative; height:1px;
}
.scissors:after{
  content:"✂"; position:absolute; left:0; top:-7px; background:var(--paper);
  padding-right:4px; font-size:9px; color:var(--dim);
}

/* a bare thumbnail crop — art only, no card chrome, for ladders and lists */
.thumb{
  width:23px; height:34px; flex:none; border:1.5px solid var(--ink); border-radius:5px;
  background:var(--card); background-image:var(--sheet); background-repeat:no-repeat;
  background-size:500% 400%;
  background-position:calc(var(--c) * 25%) calc(var(--r) * 33.3333%);
  box-shadow:var(--shadow-xs);
}
.thumb.sp{ background-image:var(--items); background-size:500% 200%;
  background-position:calc(var(--c) * 25%) calc(var(--r) * 100%); }

/* a washer tile, drawn small */
.wt{
  display:inline-block; width:11px; height:14px; border:1.5px solid var(--ink);
  border-radius:3px; background:var(--card); position:relative; vertical-align:-2px;
}
.wt:after{
  content:""; position:absolute; left:2px; right:2px; top:4px; bottom:2px;
  border:1px solid var(--rule-2); border-radius:2px;
}
.wtrow{ display:inline-flex; gap:2.5px; vertical-align:-2px }

/* misc */
table.mini{ border-collapse:collapse; font-size:8.5px; width:100% }
table.mini th, table.mini td{ border-bottom:1px dotted var(--rule-2); padding:2px 4px; text-align:left }
table.mini th{ font-weight:600; color:var(--dim); font-size:7.5px; text-transform:uppercase; letter-spacing:.08em }
table.mini tr:last-child td{ border-bottom:none }

ul.tight{ margin:0 0 6px; padding-left:14px; font-size:9px }
ul.tight li{ margin-bottom:2px }
</style>
</head>
<body>
